name: CI

"on": push

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values: Settings() requires both fields to be non-empty, but
      # the test suite never makes a real Gemini/embedding call — GeminiClient
      # and embed_query are stubbed out in tests/test_main.py, so no live
      # key is needed here.
      GEMINI_API_KEY: ci-test-key
      API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # Lets tests/test_document_service.py's real-OCR test actually run
      # here instead of skipping (it skips cleanly wherever tesseract
      # isn't installed — see that test file's module docstring).
      - name: Install tesseract-ocr
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend requirements
        run: pip install -r requirements.txt

      # Fast static gate before the (slower) test run — ruff catches
      # import/undefined-name/style regressions in seconds. mypy --strict
      # lives in its own workflow (lint.yml) so a type regression and a
      # runtime regression fail separately and legibly.
      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check)
        run: ruff check app

      - name: Run tests
        run: pytest

      # TODO: run backend/eval/run_eval.py in CI once there's a live
      # GEMINI_API_KEY safe to spend quota with (the dummy key above won't
      # work — the eval harness calls the real Gemini API) and a way to
      # seed the vector store with an indexed document beforehand. See
      # backend/eval/README.md for both preconditions.

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
