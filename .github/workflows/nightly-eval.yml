name: Nightly Eval

# Scheduled run of the eval harness against the committed baseline, every
# night. This is Feature #5 of the 10/10 upgrade: automated regression
# detection on answer quality, independent of manual workflow_dispatch runs
# (see eval.yml — this mirrors its steps, but on a schedule and always
# gated, so a silent quality regression surfaces as a red run the next
# morning instead of going unnoticed).
#
# Costs real LLM quota (GEMINI_API_KEY) and needs the demo corpus seeded
# into the vector store, same preconditions as eval.yml — see
# backend/eval/README.md.

on:
  schedule:
    # 04:00 UTC daily (03:00 CT / 00:00 ET) — overnight, before the workday.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset file to run (inside backend/eval/)"
        required: true
        default: "dataset_v1.json"
        type: choice
        options:
          - dataset_v1.json
          - dataset_v2.json
          - dataset_v3.json
      llm_provider:
        description: "LLM provider to use"
        required: true
        default: "groq"
        type: choice
        options:
          - gemini
          - groq
      baseline:
        description: "Baseline JSON to gate against"
        required: false
        default: "eval/baselines/v2_groq.json"
        type: string
      regression_tol:
        description: "Absolute regression tolerance on the 0-1 scale"
        required: false
        default: "0.05"
        type: string

# Scheduled runs can't read inputs — fall back to repository vars.
env:
  DATASET: ${{ inputs.dataset || vars.NIGHTLY_EVAL_DATASET || 'dataset_v1.json' }}
  LLM_PROVIDER: ${{ inputs.llm_provider || vars.NIGHTLY_EVAL_LLM_PROVIDER || 'groq' }}
  BASELINE: ${{ inputs.baseline || vars.NIGHTLY_EVAL_BASELINE || 'eval/baselines/v2_groq.json' }}
  REGRESSION_TOL: ${{ inputs.regression_tol || vars.NIGHTLY_EVAL_REGRESSION_TOL || '0.05' }}

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.EVAL_GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.EVAL_GROQ_API_KEY }}
      API_KEY: ci-test-key
      # LLM_PROVIDER is already set at the workflow level (above) and
      # inherited by the job automatically -- redeclaring it here as
      # ${{ env.LLM_PROVIDER }} self-references the env context from
      # within an env: block, which GitHub's parser rejects outright.
      FALLBACK_LLM_PROVIDER: ""
      HYBRID_SEARCH_ENABLED: "true"
      RERANKING_ENABLED: "false"
      WEB_SEARCH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install tesseract-ocr
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend requirements
        run: pip install -r requirements.txt

      - name: Seed vector store with demo corpus
        run: python scripts/ingest_corpus.py demo_corpus

      - name: Run nightly eval + regression gate
        run: |
          python eval/nightly_eval.py \
            --dataset "${{ env.DATASET }}" \
            --baseline "${{ env.BASELINE }}" \
            --tol "${{ env.REGRESSION_TOL }}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-results-${{ github.run_id }}
          path: backend/eval/results/*.json
          retention-days: 30

      - name: Open issue on regression
        # A scheduled nightly run has no PR to comment on and the eval
        # gate is a hard job failure — so surface the regression where a
        # human will actually see it: a GitHub issue, deduplicated by the
        # "nightly-eval-regression" label so repeated failures don't
        # spam-issue the repo (the label is created on demand here).
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'nightly-eval-regression';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: [label],
            });
            if (existing.length > 0) {
              console.log(`Regression issue already open: #${existing[0].number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[nightly-eval] Regression detected on ${new Date().toISOString().slice(0, 10)}`,
              body: `The nightly eval gate failed against baseline \`${{ env.BASELINE }}\` (dataset \`${{ env.DATASET }}\`).

              See the "Nightly Eval" workflow run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

              Check backend/eval/results/latest.json for the headline metrics, and backend/eval/README.md for how to re-baseline an intentional change.`,
              labels: [label],
            });