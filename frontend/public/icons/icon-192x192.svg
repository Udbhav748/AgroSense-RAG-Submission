<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8572d" />
      <stop offset="100%" stop-color="#8a3b19" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#pwa-grad)" />
  
  <!-- Inner Glow & Border -->
  <rect x="6" y="6" width="180" height="180" rx="36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Agronomic Leaf and Document Graphic -->
  <g transform="translate(36, 32)">
    <!-- Document shell -->
    <path d="M24 16 h52 l28 28 v64 a12 12 0 0 1 -12 12 h-68 a12 12 0 0 1 -12 -12 v-80 a12 12 0 0 1 12 -12 z" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M76 16 v24 a4 4 0 0 0 4 4 h24" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Organic Leaf Emblem Overlay -->
    <path d="M30 96 C30 55, 75 40, 85 40 C85 75, 75 110, 30 96 Z" fill="url(#leaf-grad)" opacity="0.95" />
    <path d="M30 96 C50 78, 65 65, 85 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- AI Sparkle / Insight -->
    <path d="M80 65 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#fbbf24" stroke="none" />
  </g>
</svg>
