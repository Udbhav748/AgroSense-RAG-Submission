server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers for the SPA. This is the surface that
    # actually matters for the app's JWT (stored in localStorage — see
    # src/services/api.js): the backend is a JSON API and never renders
    # markup, so a CSP here is what backstops an XSS attempt at reading
    # or exfiltrating that token, not the backend's own (separate) CSP.
    #
    # __API_BASE_ORIGIN__ is substituted at Docker build time (see
    # Dockerfile) with the same VITE_API_BASE_URL the JS bundle itself
    # was built against. Default is now empty (same-origin /api, proxied
    # below), so this normally substitutes to nothing and 'self' alone
    # covers it; still here for the cross-origin case (VITE_API_BASE_URL
    # explicitly set to a different origin), so connect-src keeps working
    # without hand-editing this file either way.
    #
    # script-src has no 'unsafe-inline': the one inline bootstrap script
    # index.html used to carry (the pre-paint theme flash fix) now lives
    # in /theme-init.js instead, specifically so this can stay strict.
    # style-src keeps 'unsafe-inline' — framer-motion (used throughout
    # src/) animates via inline style="" attributes on DOM nodes, which
    # CSP's style-src also gates; there is no framework-level way around
    # that short of a per-request nonce, which a static file server can't
    # generate. worker-src/connect-src allow blob: for pdfjs-dist (renders
    # PDFs via a worker, fetched through a blob: URL — see
    # src/components/chat/PdfPreviewModal.jsx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: __API_BASE_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Proxies /api/* to the backend container over the Compose network,
    # stripping the /api prefix — the exact same rewrite vite.config.js's
    # dev proxy does (backend routes live at /chat, /upload, /health,
    # etc., not under /api). This is what makes "one link" possible: the
    # browser only ever talks to this origin, never the backend's own
    # port directly, so VITE_API_BASE_URL can default to unset/empty
    # (services/api.js's `|| '/api'` fallback) instead of needing a
    # second public hostname baked into the JS bundle at build time.
    # BACKEND_UPSTREAM is substituted at Docker build time (see
    # Dockerfile) so this still works if the backend service is ever
    # renamed or run somewhere other than the Compose network's "backend".
    location /api/ {
        proxy_pass http://BACKEND_UPSTREAM/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /chat/stream is SSE — buffering would hold the whole response
        # until it ends, defeating streaming entirely.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # react-router's BrowserRouter needs every unknown path to fall back
    # to index.html — otherwise refreshing /chat, /documents, etc. 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
