# Alertmanager config for AgroSense-RAG (Feature #4).
# Routes every fire to the default receiver. To send real notifications,
# uncomment the webhook receiver pointing at a Slack/Discord-style
# incoming webhook (the backend's own alert_webhook.py sends the same
# {"text": ...} shape) or add an email receiver.

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

receivers:
  - name: default
    # webhook_configs:
    #   - url: "https://hooks.slack.com/services/XXXX/YYYY/ZZZZ"
    #     send_resolved: true